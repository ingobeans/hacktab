<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button id="settings-btn" onclick="openSettings()"><img src="settings.svg"></button>
    <div id="sidebar-container" style="display: none;">
        <div id="screen-dim" onclick="closeSettings()"></div>
        <div id="sidebar">
            <div id="add-widget-select-container">
                <select id="add-widget-select" onchange="clickWidgetSelect();">
                    <option disabled selected="true">Add new Widget</option>
                </select>
            </div>
            <div id="widget-settings-container"></div>
        </div>
    </div>

    <div id="widgets-container"></div>

    <script src="gen/widgetsBuild.js"></script>
    <script src="widgets.js"></script>
    <script src="script.js"></script>
</body>

</html>
